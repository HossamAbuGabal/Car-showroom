<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CarLuck - Login</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#8e44ad',      // Main purple
            bg: '#222',           // Dark background
            dark: '#111',         // Slightly lighter gray
            lightText: '#d1d5db',    // Light gray text
            inputBg: '#2c2f36',      // Input field background
          }
        }
      }
    }
  </script>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>

<body class="bg-bg text-lightText min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-dark rounded-lg shadow-xl p-8">
    <!-- Tabs -->
    <div class="flex justify-around mb-6 border-b border-gray-700 pb-2">
      <button id="loginTab" class="text-primary font-semibold border-b-2 border-primary pb-2">Login</button>
      <button id="signupTab" class="text-gray-400 hover:text-primary pb-2">Signup</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-6" onsubmit="event.preventDefault(); window.location.href='homepage.html';">
  <div>
    <label class="block mb-1 text-lightText">Email</label>
    <input type="email" class="w-full px-4 py-2 rounded bg-inputBg text-white focus:outline-none focus:ring-2 focus:ring-primary" placeholder="you@example.com" required>
  </div>
  <div>
    <label class="block mb-1 text-lightText">Password</label>
    <input type="password" class="w-full px-4 py-2 rounded bg-inputBg text-white focus:outline-none focus:ring-2 focus:ring-primary" placeholder="••••••••" required>
  </div>
  <button type="submit" class="w-full bg-primary hover:bg-purple-700 text-white font-bold py-2 rounded transition">Login</button>
</form>


    <!-- Signup Form -->
    <form id="signupForm" class="space-y-6 hidden mt-6">
      <div>
        <label class="block mb-1 text-lightText">Username</label>
        <input type="text" class="w-full px-4 py-2 rounded bg-inputBg text-white focus:outline-none focus:ring-2 focus:ring-primary" placeholder="Your name" required>
      </div>
      <div>
        <label class="block mb-1 text-lightText">Email</label>
        <input type="email" class="w-full px-4 py-2 rounded bg-inputBg text-white focus:outline-none focus:ring-2 focus:ring-primary" placeholder="you@example.com" required>
      </div>
      <div>
        <label class="block mb-1 text-lightText">Password</label>
        <input type="password" class="w-full px-4 py-2 rounded bg-inputBg text-white focus:outline-none focus:ring-2 focus:ring-primary" placeholder="Create a password" required>
      </div>
      <button type="submit" class="w-full bg-primary hover:bg-purple-700 text-white font-bold py-2 rounded transition">Signup</button>
    </form>
  </div>

  <!-- Tab Toggle Script -->
  <script>
    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');

    loginTab.addEventListener('click', () => {
      loginTab.classList.add('text-primary', 'border-primary', 'border-b-2');
      signupTab.classList.remove('text-primary', 'border-b-2');
      signupTab.classList.add('text-gray-400');
      loginForm.classList.remove('hidden');
      signupForm.classList.add('hidden');
    });

    signupTab.addEventListener('click', () => {
      signupTab.classList.add('text-primary', 'border-primary', 'border-b-2');
      loginTab.classList.remove('text-primary', 'border-b-2');
      loginTab.classList.add('text-gray-400');
      signupForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
    });
  </script>
</body>
</html>
